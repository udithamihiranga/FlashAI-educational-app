name: flashai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  http: ^1.6.0
  sqflite: ^2.3.0+4
  uuid: ^4.0.0
  provider: ^6.1.4
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.4.10
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^17.0.0
  rename: ^3.1.0
  flutter_markdown: ^0.7.3
  image: ^4.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  macOS: true
  web:
    generate: true
    image_path: "assets/icons/Layer 2.png"
  image_path: "assets/icons/Layer 2.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  remove_alpha_android: true
  adaptive_icon_foreground: "assets/icons/Layer 2.png"
  windows:
    generate: true
    image_path: "assets/icons/Layer 2.png"
